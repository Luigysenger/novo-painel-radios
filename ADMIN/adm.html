<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Gerenciador de Rádios</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 120px; /* Espaço para o player fixo */
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(30, 41, 59, 0.85);
            padding: 20px 30px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        header h1 {
            font-size: 20px;
            color: #f8fafc;
        }
        .btn-sair {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }
        .btn-sair:hover {
            background: #dc2626;
        }
        .card-form {
            background: rgba(30, 41, 59, 0.85);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .card-form h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #a78bfa;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: bold;
            color: #94a3b8;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 11px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            font-size: 14px;
            color: #f8fafc;
            outline: none;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #8b5cf6;
        }
        .btn-salvar {
            background: #7c3aed;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        .btn-salvar:hover {
            background: #6d28d9;
        }
        .radios-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .radio-card {
            background: rgba(30, 41, 59, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .radio-card:hover {
            transform: translateY(-3px);
        }
        /* Estilo Neon quando a rádio está ativa/tocando */
        .radio-card.active-neon {
            border-color: var(--card-color, #a78bfa);
            box-shadow: 0 0 15px var(--card-color, #a78bfa), inset 0 0 10px rgba(255, 255, 255, 0.1);
        }
        .radio-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        .radio-icon-display {
            font-size: 24px;
        }
        .radio-card h3 {
            font-size: 16px;
            color: #f8fafc;
            word-break: break-all;
        }
        .radio-card p {
            font-size: 12px;
            color: #94a3b8;
            word-break: break-all;
            margin-bottom: 15px;
        }
        .card-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #334155;
            padding-top: 12px;
        }
        .card-tools-right {
            display: flex;
            gap: 10px;
        }
        .action-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 16px;
            transition: transform 0.1s;
        }
        .action-btn:hover {
            transform: scale(1.15);
        }

        /* PAINEL FLUTUANTE DE PERSONALIZAÇÃO (Cores e Ícones) */
        .customizer-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .customizer-content {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
            border: 1px solid #475569;
        }
        .customizer-content h3 {
            margin-bottom: 15px;
            color: #a78bfa;
            font-size: 18px;
        }
        .color-picker-wrapper {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .color-dot {
            width: 30px; height: 30px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .color-dot.selected {
            border-color: #fff;
            transform: scale(1.1);
        }
        .icons-grid-picker {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            max-height: 180px;
            overflow-y: auto;
            margin-bottom: 20px;
            padding: 5px;
            background: #0f172a;
            border-radius: 8px;
        }
        .icon-option {
            font-size: 24px;
            text-align: center;
            padding: 8px;
            cursor: pointer;
            border-radius: 6px;
            border: 1px solid transparent;
        }
        .icon-option:hover {
            background: #334155;
        }
        .icon-option.selected {
            background: #7c3aed;
            border-color: #c4b5fd;
        }

        /* PLAYER FIXO ESTILO RÁDIO DE CARRO NA PARTE INFERIOR */
        .car-player-bar {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid #334155;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 900;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
        }
        .player-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .player-info h4 {
            font-size: 15px;
            color: #f8fafc;
        }
        .player-info span {
            font-size: 12px;
            color: #94a3b8;
        }
        .player-controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .control-btn {
            background: #334155;
            color: white;
            border: none;
            width: 45px; height: 45px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.2s;
        }
        .control-btn:hover {
            background: #7c3aed;
        }
        .control-btn.main-play {
            width: 55px; height: 55px;
            background: #7c3aed;
            font-size: 22px;
        }
        .control-btn.main-play:hover {
            background: #6d28d9;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Painel do Administrador (Rádios)</h1>
            <button class="btn-sair" id="btnSair">Sair</button>
        </header>

        <!-- Formulário para Adicionar / Editar Rádio -->
        <div class="card-form">
            <h2 id="formTitulo">Adicionar Nova Rádio</h2>
            <input type="hidden" id="radioIdEditando">
            <div class="form-group">
                <label>NOME DA RÁDIO</label>
                <input type="text" id="nomeRadio" placeholder="Ex: Rádio Hits FM" autocomplete="off">
            </div>
            <div class="form-group">
                <label>URL / LINK DE STREAMING</label>
                <input type="text" id="urlRadio" placeholder="https://exemplo.com/stream" autocomplete="off">
            </div>
            <button type="button" id="btnSalvarRadio" class="btn-salvar">CADASTRAR RÁDIO</button>
            <button type="button" id="btnCancelarEdicao" class="btn-salvar hidden" style="background: #475569; margin-left: 10px;">CANCELAR</button>
        </div>

        <h2>Rádios Cadastradas</h2>
        <div class="radios-grid" id="gridRadios">
            <!-- Cards gerados dinamicamente -->
        </div>
    </div>

    <!-- MODAL DE PERSONALIZAÇÃO (CORES E ÍCONES) -->
    <div id="modalPersonalizacao" class="customizer-modal hidden">
        <div class="customizer-content">
            <h3>Personalizar Rádio</h3>
            <input type="hidden" id="customRadioId">
            
            <label style="font-size: 11px; font-weight: bold; color: #94a3b8; margin-bottom: 8px; display: block;">ESCOLHA A COR DO CARD (NEON)</label>
            <div class="color-picker-wrapper" id="colorPickerWrapper">
                <!-- Cores predefinidas -->
                <div class="color-dot" style="background: #7c3aed;" data-color="#7c3aed"></div>
                <div class="color-dot" style="background: #ef4444;" data-color="#ef4444"></div>
                <div class="color-dot" style="background: #3b82f6;" data-color="#3b82f6"></div>
                <div class="color-dot" style="background: #10b981;" data-color="#10b981"></div>
                <div class="color-dot" style="background: #f59e0b;" data-color="#f59e0b"></div>
                <div class="color-dot" style="background: #ec4899;" data-color="#ec4899"></div>
                <div class="color-dot" style="background: #06b6d4;" data-color="#06b6d4"></div>
                <div class="color-dot" style="background: #84cc16;" data-color="#84cc16"></div>
            </div>

            <label style="font-size: 11px; font-weight: bold; color: #94a3b8; margin-bottom: 8px; display: block;">ESCOLHA UM ÍCONE</label>
            <div class="icons-grid-picker" id="iconsGridPicker">
                <!-- 20 Ícones diferentes -->
                <div class="icon-option" data-icon="📻">📻</div>
                <div class="icon-option" data-icon="🎵">🎵</div>
                <div class="icon-option" data-icon="🎶">🎶</div>
                <div class="icon-option" data-icon="🎧">🎧</div>
                <div class="icon-option" data-icon="🎙️">🎙️</div>
                <div class="icon-option" data-icon="🎸">🎸</div>
                <div class="icon-option" data-icon="🎷">🎷</div>
                <div class="icon-option" data-icon="🎺">🎺</div>
                <div class="icon-option" data-icon="🎻">🎻</div>
                <div class="icon-option" data-icon="🎹">🎹</div>
                <div class="icon-option" data-icon="🎤">🎤</div>
                <div class="icon-option" data-icon="⚡">⚡</div>
                <div class="icon-option" data-icon="🔥">🔥</div>
                <div class="icon-option" data-icon="⭐">⭐</div>
                <div class="icon-option" data-icon="🚀">🚀</div>
                <div class="icon-option" data-icon="💎">💎</div>
                <div class="icon-option" data-icon="🌍">🌍</div>
                <div class="icon-option" data-icon="🎯">🎯</div>
                <div class="icon-option" data-icon="💡">💡</div>
                <div class="icon-option" data-icon="🔊">🔊</div>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button type="button" id="btnSalvarPersonalizacao" class="btn-salvar" style="flex: 1;">SALVAR</button>
                <button type="button" id="btnFecharModal" class="btn-salvar" style="background: #475569; flex: 1;">CANCELAR</button>
            </div>
        </div>
    </div>

    <!-- PLAYER FIXO INFERIOR (ESTILO RÁDIO DE CARRO) -->
    <div class="car-player-bar hidden" id="carPlayerBar">
        <div class="player-info">
            <span id="playerIconDisplay" style="font-size: 28px;">📻</span>
            <div>
                <h4 id="playerNameDisplay">Selecione uma Rádio</h4>
                <span id="playerStatusDisplay">Parado</span>
            </div>
        </div>
        <div class="player-controls">
            <button class="control-btn" id="btnAnterior" title="Rádio Anterior">⏮️</button>
            <button class="control-btn main-play" id="btnPlayPause" title="Tocar / Pausar">▶️</button>
            <button class="control-btn" id="btnProximo" title="Próxima Rádio">⏭️</button>
        </div>
    </div>

    <!-- Elemento de áudio oculto para o streaming -->
    <audio id="audioStreaming" preload="none"></audio>

    <script type="module">
        import { db } from '../firebase-config.js';
        import { ref, set, push, get, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        window.addEventListener('DOMContentLoaded', () => {
            const adminLogado = localStorage.getItem('adminLogado');
            if (adminLogado !== 'true') {
                alert("Acesso restrito! Faça login com a conta de Administrador.");
                window.location.href = "../index.html";
            }
            carregarRadios();
        });

        document.getElementById('btnSair').addEventListener('click', () => {
            pararAudio();
            localStorage.removeItem('adminLogado');
            window.location.href = "../index.html";
        });

        const nomeRadioInput = document.getElementById('nomeRadio');
        const urlRadioInput = document.getElementById('urlRadio');
        const btnSalvarRadio = document.getElementById('btnSalvarRadio');
        const btnCancelarEdicao = document.getElementById('btnCancelarEdicao');
        const radioIdEditandoInput = document.getElementById('radioIdEditando');
        const formTitulo = document.getElementById('formTitulo');
        const gridRadios = document.getElementById('gridRadios');

        // Variáveis globais do player de rádio
        let listaRadiosObj = [];
        let indiceRadioAtual = -1;
        const audioElement = document.getElementById('audioStreaming');
        const carPlayerBar = document.getElementById('carPlayerBar');
        const playerNameDisplay = document.getElementById('playerNameDisplay');
        const playerStatusDisplay = document.getElementById('playerStatusDisplay');
        const playerIconDisplay = document.getElementById('playerIconDisplay');
        const btnPlayPause = document.getElementById('btnPlayPause');

        // Seleção no Modal
        let corSelecionada = "#7c3aed";
        let iconeSelecionado = "📻";

        // Gerenciar seleção de cores no modal
        document.querySelectorAll('.color-dot').forEach(dot => {
            dot.addEventListener('click', (e) => {
                document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
                e.target.classList.add('selected');
                corSelecionada = e.target.getAttribute('data-color');
            });
        });

        // Gerenciar seleção de ícones no modal
        document.querySelectorAll('.icon-option').forEach(opt => {
            opt.addEventListener('click', (e) => {
                document.querySelectorAll('.icon-option').forEach(o => o.classList.remove('selected'));
                e.target.classList.add('selected');
                iconeSelecionado = e.target.getAttribute('data-icon');
            });
        });

        // SALVAR OU EDITAR RÁDIO
        async function salvarRadio() {
            const nome = nomeRadioInput.value.trim();
            const url = urlRadioInput.value.trim();
            const idEdicao = radioIdEditandoInput.value;

            if (!nome || !url) {
                alert("Por favor, preencha o nome e o link da rádio.");
                return;
            }

            try {
                if (idEdicao) {
                    const radioRef = ref(db, 'radios_cadastradas/' + idEdicao);
                    await update(radioRef, { nome: nome, url: url });
                    alert("Rádio atualizada com sucesso!");
                } else {
                    const radiosRef = ref(db, 'radios_cadastradas');
                    const novaRadioRef = push(radiosRef);
                    await set(novaRadioRef, { 
                        nome: nome, 
                        url: url, 
                        cor: "#7c3aed", 
                        icone: "📻" 
                    });
                    alert("Rádio cadastrada com sucesso!");
                }

                limparFormulario();
                carregarRadios();
            } catch (erro) {
                console.error("Erro ao salvar rádio:", erro);
                alert("Erro ao salvar rádio no Firebase.");
            }
        }

        // CARREGAR RÁDIOS DO FIREBASE
        async function carregarRadios() {
            gridRadios.innerHTML = "<p style='color: #94a3b8;'>Carregando rádios...</p>";
            try {
                const radiosRef = ref(db, 'radios_cadastradas');
                const snapshot = await get(radiosRef);

                gridRadios.innerHTML = "";
                listaRadiosObj = [];

                if (snapshot.exists()) {
                    snapshot.forEach((childSnapshot) => {
                        const id = childSnapshot.key;
                        const dados = childSnapshot.val();
                        listaRadiosObj.push({ id, ...dados });
                    });

                    listaRadiosObj.forEach((radio, index) => {
                        const corCard = radio.cor || "#7c3aed";
                        const iconeCard = radio.icone || "📻";

                        const card = document.createElement('div');
                        card.className = 'radio-card';
                        card.id = `card-radio-${index}`;
                        card.style.setProperty('--card-color', corCard);
                        
                        card.innerHTML = `
                            <div>
                                <div class="radio-header">
                                    <span class="radio-icon-display">${iconeCard}</span>
                                    <h3>${radio.nome}</h3>
                                </div>
                                <p>${radio.url}</p>
                            </div>
                            <div class="card-actions">
                                <button class="action-btn btn-deletar" title="Deletar Rádio" data-id="${radio.id}">🗑️</button>
                                <div class="card-tools-right">
                                    <button class="action-btn btn-personalizar" title="Personalizar Cores e Ícone" data-id="${radio.id}" data-cor="${corCard}" data-icone="${iconeCard}">🎨</button>
                                    <button class="action-btn btn-editar" title="Editar Rádio" data-id="${radio.id}" data-nome="${radio.nome}" data-url="${radio.url}">✏️</button>
                                </div>
                            </div>
                        `;

                        // Clicar no card ativa a rádio estilo rádio de carro
                        card.addEventListener('click', (e) => {
                            // Evita disparar se clicar nos botões de ação
                            if (e.target.closest('button')) return;
                            tocarRadioPorIndice(index);
                        });

                        gridRadios.appendChild(card);
                    });

                    // Atribuir eventos aos botões internos
                    document.querySelectorAll('.btn-deletar').forEach(btn => {
                        btn.addEventListener('click', (e) => deletarRadio(e.target.getAttribute('data-id')));
                    });

                    document.querySelectorAll('.btn-editar').forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            const id = e.target.getAttribute('data-id');
                            const nome = e.target.getAttribute('data-nome');
                            const url = e.target.getAttribute('data-url');
                            prepararEdicao(id, nome, url);
                        });
                    });

                    document.querySelectorAll('.btn-personalizar').forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            const id = e.target.getAttribute('data-id');
                            const corAtual = e.target.getAttribute('data-cor');
                            const iconeAtual = e.target.getAttribute('data-icone');
                            abrirModalPersonalizacao(id, corAtual, iconeAtual);
                        });
                    });

                } else {
                    gridRadios.innerHTML = "<p style='color: #94a3b8;'>Nenhuma rádio cadastrada ainda.</p>";
                    carPlayerBar.classList.add('hidden');
                }
            } catch (erro) {
                console.error("Erro ao carregar rádios:", erro);
                gridRadios.innerHTML = "<p style='color: #ef4444;'>Erro ao carregar rádios do banco.</p>";
            }
        }

        // FUNÇÃO DE TOCAR RÁDIO (ESTILO RÁDIO DE CARRO)
        function tocarRadioPorIndice(index) {
            if (index < 0 || index >= listaRadiosObj.length) return;
            indiceRadioAtual = index;
            const radio = listaRadiosObj[indiceRadioAtual];

            // Atualiza visual Neon nos cards
            document.querySelectorAll('.radio-card').forEach((c, idx) => {
                if (idx === indiceRadioAtual) {
                    c.classList.add('active-neon');
                } else {
                    c.classList.remove('active-neon');
                }
            });

            // Configura player inferior
            carPlayerBar.classList.remove('hidden');
            playerNameDisplay.innerText = radio.nome;
            playerIconDisplay.innerText = radio.icone || "📻";
            playerStatusDisplay.innerText = "Conectando...";
            btnPlayPause.innerText = "⏸️";

            audioElement.src = radio.url;
            audioElement.play().then(() => {
                playerStatusDisplay.innerText = "Tocando ao vivo";
            }).catch(err => {
                console.error("Erro ao reproduzir streaming:", err);
                playerStatusDisplay.innerText = "Erro ao reproduzir stream";
                alert("Não foi possível reproduzir este link de streaming diretamente. Verifique se o link é válido.");
            });
        }

        function pararAudio() {
            audioElement.pause();
            audioElement.src = "";
            playerStatusDisplay.innerText = "Parado";
            btnPlayPause.innerText = "▶️";
        }

        // BOTÕES DE CONTROLE DO PLAYER INFERIOR
        document.getElementById('btnProximo').addEventListener('click', () => {
            if (listaRadiosObj.length === 0) return;
            let proximo = indiceRadioAtual + 1;
            if (proximo >= listaRadiosObj.length) proximo = 0; // Loop infinito estilo carro
            tocarRadioPorIndice(proximo);
        });

        document.getElementById('btnAnterior').addEventListener('click', () => {
            if (listaRadiosObj.length === 0) return;
            let anterior = indiceRadioAtual - 1;
            if (anterior < 0) anterior = listaRadiosObj.length - 1;
            tocarRadioPorIndice(anterior);
        });

        btnPlayPause.addEventListener('click', () => {
            if (audioElement.paused) {
                if (indiceRadioAtual === -1 && listaRadiosObj.length > 0) {
                    tocarRadioPorIndice(0);
                } else if (indiceRadioAtual !== -1) {
                    audioElement.play();
                    playerStatusDisplay.innerText = "Tocando ao vivo";
                    btnPlayPause.innerText = "⏸️";
                }
            } else {
                audioElement.pause();
                playerStatusDisplay.innerText = "Pausado";
                btnPlayPause.innerText = "▶️";
            }
        });

        // MODAL DE PERSONALIZAÇÃO
        const modalPersonalizacao = document.getElementById('modalPersonalizacao');
        const customRadioIdInput = document.getElementById('customRadioId');

        function abrirModalPersonalizacao(id, corAtual, iconeAtual) {
            customRadioIdInput.value = id;
            corSelecionada = corAtual || "#7c3aed";
            iconeSelecionado = iconeAtual || "📻";

            // Marca visualmente a cor correta
            document.querySelectorAll('.color-dot').forEach(dot => {
                if (dot.getAttribute('data-color') === corSelecionada) {
                    dot.classList.add('selected');
                } else {
                    dot.classList.remove('selected');
                }
            });

            // Marca visualmente o ícone correto
            document.querySelectorAll('.icon-option').forEach(opt => {
                if (opt.getAttribute('data-icon') === iconeSelecionado) {
                    opt.classList.add('selected');
                } else {
                    opt.classList.remove('selected');
                }
            });

            modalPersonalizacao.classList.remove('hidden');
        }

        document.getElementById('btnFecharModal').addEventListener('click', () => {
            modalPersonalizacao.classList.add('hidden');
        });

        document.getElementById('btnSalvarPersonalizacao').addEventListener('click', async () => {
            const id = customRadioIdInput.value;
            try {
                const radioRef = ref(db, 'radios_cadastradas/' + id);
                await update(radioRef, {
                    cor: corSelecionada,
                    icone: iconeSelecionado
                });
                alert("Personalização salva com sucesso!");
                modalPersonalizacao.classList.add('hidden');
                carregarRadios();
            } catch (err) {
                console.error("Erro ao salvar customização:", err);
                alert("Erro ao salvar no banco de dados.");
            }
        });

        // DELETAR RÁDIO
        async function deletarRadio(id) {
            if (confirm("Tem certeza que deseja excluir esta rádio?")) {
                try {
                    await remove(ref(db, 'radios_cadastradas/' + id));
                    alert("Rádio removida com sucesso!");
                    carregarRadios();
                } catch (erro) {
                    console.error("Erro ao remover rádio:", erro);
                    alert("Erro ao remover rádio.");
                }
            }
        }

        function prepararEdicao(id, nome, url) {
            radioIdEditandoInput.value = id;
            nomeRadioInput.value = nome;
            urlRadioInput.value = url;
            formTitulo.innerText = "Editar Rádio";
            btnSalvarRadio.innerText = "ATUALIZAR RÁDIO";
            btnCancelarEdicao.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function limparFormulario() {
            radioIdEditandoInput.value = "";
            nomeRadioInput.value = "";
            urlRadioInput.value = "";
            formTitulo.innerText = "Adicionar Nova Rádio";
            btnSalvarRadio.innerText = "CADASTRAR RÁDIO";
            btnCancelarEdicao.classList.add('hidden');
        }

        btnCancelarEdicao.addEventListener('click', limparFormulario);
        btnSalvarRadio.addEventListener('click', salvarRadio);

        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && modalPersonalizacao.classList.contains('hidden')) {
                salvarRadio();
            }
        });
    </script>
</body>
</html>
