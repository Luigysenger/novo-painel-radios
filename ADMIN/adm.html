<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Gerenciador de Rádios</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 120px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(30, 41, 59, 0.85);
            padding: 20px 30px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        header h1 {
            font-size: 20px;
            color: #f8fafc;
        }
        .btn-sair {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }
        .btn-sair:hover {
            background: #dc2626;
        }
        .card-form {
            background: rgba(30, 41, 59, 0.85);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .card-form h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #a78bfa;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: bold;
            color: #94a3b8;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        .form-group input {
            width: 100%;
            padding: 11px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            font-size: 14px;
            color: #f8fafc;
            outline: none;
        }
        .form-group input:focus {
            border-color: #8b5cf6;
        }
        .btn-salvar {
            background: #7c3aed;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        .btn-salvar:hover {
            background: #6d28d9;
        }
        .radios-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        /* Estilo Moderno dos Cards Inspirado no seu Painel */
        .radio-card {
            background-color: var(--card-bg, #64748b);
            border-radius: 16px;
            padding: 20px 15px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            height: 150px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border: 2px solid transparent;
        }
        .radio-card:hover {
            transform: translateY(-4px);
        }
        /* Neon ao redor quando ativo */
        .radio-card.active-neon {
            border-color: #ffffff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.6), inset 0 0 15px rgba(255, 255, 255, 0.3);
        }
        .radio-card-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
        }
        .radio-icon-display {
            font-size: 36px;
            margin-bottom: 8px;
        }
        .radio-card h3 {
            font-size: 13px;
            color: #0f172a;
            font-weight: bold;
            text-align: center;
            width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .card-actions {
            display: flex;
            justify-content: space-between;
            width: 100%;
            border-top: 1px solid rgba(0, 0, 0, 0.15);
            padding-top: 8px;
        }
        .action-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 14px;
            transition: transform 0.1s;
        }
        .action-btn:hover {
            transform: scale(1.2);
        }
        .card-tools-right {
            display: flex;
            gap: 8px;
        }

        /* Modal de Personalização (20 Cores + 20 Ícones) */
        .customizer-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .customizer-content {
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 480px;
            border: 1px solid #475569;
        }
        .customizer-content h3 {
            margin-bottom: 12px;
            color: #a78bfa;
            font-size: 18px;
        }
        .color-picker-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }
        .color-dot {
            width: 36px; height: 36px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.1s;
        }
        .color-dot:hover { transform: scale(1.1); }
        .color-dot.selected { border-color: #fff; transform: scale(1.15); box-shadow: 0 0 10px #fff; }

        .icons-grid-picker {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            max-height: 140px;
            overflow-y: auto;
            margin-bottom: 20px;
            padding: 5px;
            background: #0f172a;
            border-radius: 8px;
        }
        .icon-option {
            font-size: 22px;
            text-align: center;
            padding: 6px;
            cursor: pointer;
            border-radius: 6px;
            border: 1px solid transparent;
        }
        .icon-option:hover { background: #334155; }
        .icon-option.selected { background: #7c3aed; border-color: #c4b5fd; }

        /* Player Estilo Rádio de Carro na Base */
        .car-player-bar {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid #334155;
            padding: 12px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 900;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
        }
        .player-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .player-info h4 { font-size: 15px; color: #f8fafc; }
        .player-controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .control-btn {
            background: #334155;
            color: white;
            border: none;
            width: 42px; height: 42px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.2s;
        }
        .control-btn:hover { background: #7c3aed; }
        .control-btn.main-play { width: 50px; height: 50px; background: #7c3aed; font-size: 20px; }
        .control-btn.main-play:hover { background: #6d28d9; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Painel do Administrador (Rádios)</h1>
            <button class="btn-sair" id="btnSair">Sair</button>
        </header>

        <div class="card-form">
            <h2 id="formTitulo">Adicionar Nova Rádio</h2>
            <input type="hidden" id="radioIdEditando">
            <div class="form-group">
                <label>NOME DA RÁDIO</label>
                <input type="text" id="nomeRadio" placeholder="Ex: Rádio Hits FM" autocomplete="off">
            </div>
            <div class="form-group">
                <label>URL / LINK DE STREAMING</label>
                <input type="text" id="urlRadio" placeholder="https://exemplo.com/stream" autocomplete="off">
            </div>
            <button type="button" id="btnSalvarRadio" class="btn-salvar">CADASTRAR RÁDIO</button>
            <button type="button" id="btnCancelarEdicao" class="btn-salvar hidden" style="background: #475569; margin-left: 10px;">CANCELAR</button>
        </div>

        <h2>Rádios Cadastradas</h2>
        <div class="radios-grid" id="gridRadios"></div>
    </div>

    <!-- MODAL DE PERSONALIZAÇÃO (20 CORES E 20 ÍCONES) -->
    <div id="modalPersonalizacao" class="customizer-modal hidden">
        <div class="customizer-content">
            <h3>Personalizar Card da Rádio</h3>
            <input type="hidden" id="customRadioId">
            
            <label style="font-size: 11px; font-weight: bold; color: #94a3b8; margin-bottom: 6px; display: block;">ESCOLHA A COR DO CARD (20 OPÇÕES)</label>
            <div class="color-picker-grid" id="colorPickerGrid">
                <!-- 20 Cores Suaves / Pastéis idênticas ao estilo da foto -->
                <div class="color-dot" style="background: #a3e635;" data-color="#a3e635"></div>
                <div class="color-dot" style="background: #bef264;" data-color="#bef264"></div>
                <div class="color-dot" style="background: #86efac;" data-color="#86efac"></div>
                <div class="color-dot" style="background: #6ee7b7;" data-color="#6ee7b7"></div>
                <div class="color-dot" style="background: #5eead4;" data-color="#5eead4"></div>
                <div class="color-dot" style="background: #7dd3fc;" data-color="#7dd3fc"></div>
                <div class="color-dot" style="background: #93c5fd;" data-color="#93c5fd"></div>
                <div class="color-dot" style="background: #c4b5fd;" data-color="#c4b5fd"></div>
                <div class="color-dot" style="background: #f472b6;" data-color="#f472b6"></div>
                <div class="color-dot" style="background: #fda4af;" data-color="#fda4af"></div>
                <div class="color-dot" style="background: #fcd34d;" data-color="#fcd34d"></div>
                <div class="color-dot" style="background: #fde047;" data-color="#fde047"></div>
                <div class="color-dot" style="background: #fb923c;" data-color="#fb923c"></div>
                <div class="color-dot" style="background: #d8b4fe;" data-color="#d8b4fe"></div>
                <div class="color-dot" style="background: #a5b4fc;" data-color="#a5b4fc"></div>
                <div class="color-dot" style="background: #cbd5e1;" data-color="#cbd5e1"></div>
                <div class="color-dot" style="background: #94a3b8;" data-color="#94a3b8"></div>
                <div class="color-dot" style="background: #64748b;" data-color="#64748b"></div>
                <div class="color-dot" style="background: #e2e8f0;" data-color="#e2e8f0"></div>
                <div class="color-dot" style="background: #fbcfe8;" data-color="#fbcfe8"></div>
            </div>

            <label style="font-size: 11px; font-weight: bold; color: #94a3b8; margin-bottom: 6px; display: block;">ESCOLHA UM ÍCONE</label>
            <div class="icons-grid-picker" id="iconsGridPicker">
                <div class="icon-option" data-icon="📻">📻</div>
                <div class="icon-option" data-icon="🎵">🎵</div>
                <div class="icon-option" data-icon="🎶">🎶</div>
                <div class="icon-option" data-icon="🎧">🎧</div>
                <div class="icon-option" data-icon="🎙️">🎙️</div>
                <div class="icon-option" data-icon="🎸">🎸</div>
                <div class="icon-option" data-icon="🎷">🎷</div>
                <div class="icon-option" data-icon="🎺">🎺</div>
                <div class="icon-option" data-icon="🎻">🎻</div>
                <div class="icon-option" data-icon="🎹">🎹</div>
                <div class="icon-option" data-icon="🎤">🎤</div>
                <div class="icon-option" data-icon="⚡">⚡</div>
                <div class="icon-option" data-icon="🔥">🔥</div>
                <div class="icon-option" data-icon="⭐">⭐</div>
                <div class="icon-option" data-icon="🚀">🚀</div>
                <div class="icon-option" data-icon="💎">💎</div>
                <div class="icon-option" data-icon="🌍">🌍</div>
                <div class="icon-option" data-icon="🎯">🎯</div>
                <div class="icon-option" data-icon="💡">💡</div>
                <div class="icon-option" data-icon="🔊">🔊</div>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button type="button" id="btnSalvarPersonalizacao" class="btn-salvar" style="flex: 1;">SALVAR</button>
                <button type="button" id="btnFecharModal" class="btn-salvar" style="background: #475569; flex: 1;">CANCELAR</button>
            </div>
        </div>
    </div>

    <!-- PLAYER FIXO INFERIOR -->
    <div class="car-player-bar hidden" id="carPlayerBar">
        <div class="player-info">
            <span id="playerIconDisplay" style="font-size: 26px;">📻</span>
            <div>
                <h4 id="playerNameDisplay">Selecione uma Rádio</h4>
            </div>
        </div>
        <div class="player-controls">
            <button class="control-btn" id="btnAnterior" title="Rádio Anterior">⏮️</button>
            <button class="control-btn main-play" id="btnPlayPause" title="Tocar / Pausar">▶️</button>
            <button class="control-btn" id="btnProximo" title="Próxima Rádio">⏭️</button>
        </div>
    </div>

    <audio id="audioStreaming" preload="none"></audio>

    <script type="module">
        import { db } from '../firebase-config.js';
        import { ref, set, push, get, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        window.addEventListener('DOMContentLoaded', () => {
            const adminLogado = localStorage.getItem('adminLogado');
            if (adminLogado !== 'true') {
                alert("Acesso restrito! Faça login com a conta de Administrador.");
                window.location.href = "../index.html";
            }
            carregarRadios();
        });

        document.getElementById('btnSair').addEventListener('click', () => {
            audioElement.pause();
            localStorage.removeItem('adminLogado');
            window.location.href = "../index.html";
        });

        const nomeRadioInput = document.getElementById('nomeRadio');
        const urlRadioInput = document.getElementById('urlRadio');
        const btnSalvarRadio = document.getElementById('btnSalvarRadio');
        const btnCancelarEdicao = document.getElementById('btnCancelarEdicao');
        const radioIdEditandoInput = document.getElementById('radioIdEditando');
        const formTitulo = document.getElementById('formTitulo');
        const gridRadios = document.getElementById('gridRadios');

        let listaRadiosObj = [];
        let indiceRadioAtual = -1;
        const audioElement = document.getElementById('audioStreaming');
        const carPlayerBar = document.getElementById('carPlayerBar');
        const playerNameDisplay = document.getElementById('playerNameDisplay');
        const playerIconDisplay = document.getElementById('playerIconDisplay');
        const btnPlayPause = document.getElementById('btnPlayPause');

        let corSelecionada = "#86efac";
        let iconeSelecionado = "📻";

        document.querySelectorAll('.color-dot').forEach(dot => {
            dot.addEventListener('click', (e) => {
                document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
                e.target.classList.add('selected');
                corSelecionada = e.target.getAttribute('data-color');
            });
        });

        document.querySelectorAll('.icon-option').forEach(opt => {
            opt.addEventListener('click', (e) => {
                document.querySelectorAll('.icon-option').forEach(o => o.classList.remove('selected'));
                e.target.classList.add('selected');
                iconeSelecionado = e.target.getAttribute('data-icon');
            });
        });

        async function salvarRadio() {
            const nome = nomeRadioInput.value.trim();
            const url = urlRadioInput.value.trim();
            const idEdicao = radioIdEditandoInput.value;

            if (!nome || !url) {
                alert("Por favor, preencha o nome e o link da rádio.");
                return;
            }

            try {
                if (idEdicao) {
                    const radioRef = ref(db, 'radios_cadastradas/' + idEdicao);
                    await update(radioRef, { nome: nome, url: url });
                } else {
                    const radiosRef = ref(db, 'radios_cadastradas');
                    const novaRadioRef = push(radiosRef);
                    await set(novaRadioRef, { 
                        nome: nome, 
                        url: url, 
                        cor: "#86efac", 
                        icone: "📻" 
                    });
                }
                limparFormulario();
                carregarRadios();
            } catch (erro) {
                console.error("Erro ao salvar rádio:", erro);
            }
        }

        async function carregarRadios() {
            try {
                const radiosRef = ref(db, 'radios_cadastradas');
                const snapshot = await get(radiosRef);

                gridRadios.innerHTML = "";
                listaRadiosObj = [];

                if (snapshot.exists()) {
                    snapshot.forEach((childSnapshot) => {
                        const id = childSnapshot.key;
                        const dados = childSnapshot.val();
                        listaRadiosObj.push({ id, ...dados });
                    });

                    listaRadiosObj.forEach((radio, index) => {
                        const corCard = radio.cor || "#86efac";
                        const iconeCard = radio.icone || "📻";

                        const card = document.createElement('div');
                        card.className = 'radio-card';
                        card.id = `card-radio-${index}`;
                        card.style.setProperty('--card-bg', corCard);
                        
                        card.innerHTML = `
                            <div class="radio-card-top">
                                <span class="radio-icon-display">${iconeCard}</span>
                                <h3 title="${radio.nome}">${radio.nome}</h3>
                            </div>
                            <div class="card-actions">
                                <button class="action-btn btn-deletar" title="Deletar" data-id="${radio.id}">🗑️</button>
                                <div class="card-tools-right">
                                    <button class="action-btn btn-personalizar" title="Personalizar" data-id="${radio.id}" data-cor="${corCard}" data-icone="${iconeCard}">🎨</button>
                                    <button class="action-btn btn-editar" title="Editar" data-id="${radio.id}" data-nome="${radio.nome}" data-url="${radio.url}">✏️</button>
                                </div>
                            </div>
                        `;

                        // Ao clicar no card, toca imediatamente sem mensagens na tela
                        card.addEventListener('click', (e) => {
                            if (e.target.closest('button')) return;
                            tocarRadioPorIndice(index);
                        });

                        gridRadios.appendChild(card);
                    });

                    document.querySelectorAll('.btn-deletar').forEach(btn => {
                        btn.addEventListener('click', (e) => deletarRadio(e.target.getAttribute('data-id')));
                    });

                    document.querySelectorAll('.btn-editar').forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            prepararEdicao(e.target.getAttribute('data-id'), e.target.getAttribute('data-nome'), e.target.getAttribute('data-url'));
                        });
                    });

                    document.querySelectorAll('.btn-personalizar').forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            abrirModalPersonalizacao(e.target.getAttribute('data-id'), e.target.getAttribute('data-cor'), e.target.getAttribute('data-icone'));
                        });
                    });

                } else {
                    gridRadios.innerHTML = "<p style='color: #94a3b8;'>Nenhuma rádio cadastrada ainda.</p>";
                    carPlayerBar.classList.add('hidden');
                }
            } catch (erro) {
                console.error("Erro ao carregar rádios:", erro);
            }
        }

        // Tocar rádio imediatamente sem alertas
        function tocarRadioPorIndice(index) {
            if (index < 0 || index >= listaRadiosObj.length) return;
            indiceRadioAtual = index;
            const radio = listaRadiosObj[indiceRadioAtual];

            document.querySelectorAll('.radio-card').forEach((c, idx) => {
                if (idx === indiceRadioAtual) {
                    c.classList.add('active-neon');
                } else {
                    c.classList.remove('active-neon');
                }
            });

            carPlayerBar.classList.remove('hidden');
            playerNameDisplay.innerText = radio.nome;
            playerIconDisplay.innerText = radio.icone || "📻";
            btnPlayPause.innerText = "⏸️";

            audioElement.src = radio.url;
            audioElement.play().catch(err => console.error("Erro no stream:", err));
        }

        document.getElementById('btnProximo').addEventListener('click', () => {
            if (listaRadiosObj.length === 0) return;
            let proximo = indiceRadioAtual + 1;
            if (proximo >= listaRadiosObj.length) proximo = 0;
            tocarRadioPorIndice(proximo);
        });

        document.getElementById('btnAnterior').addEventListener('click', () => {
            if (listaRadiosObj.length === 0) return;
            let anterior = indiceRadioAtual - 1;
            if (anterior < 0) anterior = listaRadiosObj.length - 1;
            tocarRadioPorIndice(anterior);
        });

        btnPlayPause.addEventListener('click', () => {
            if (audioElement.paused) {
                if (indiceRadioAtual === -1 && listaRadiosObj.length > 0) {
                    tocarRadioPorIndice(0);
                } else if (indiceRadioAtual !== -1) {
                    audioElement.play();
                    btnPlayPause.innerText = "⏸️";
                }
            } else {
                audioElement.pause();
                btnPlayPause.innerText = "▶️";
            }
        });

        const modalPersonalizacao = document.getElementById('modalPersonalizacao');
        const customRadioIdInput = document.getElementById('customRadioId');

        function abrirModalPersonalizacao(id, corAtual, iconeAtual) {
            customRadioIdInput.value = id;
            corSelecionada = corAtual || "#86efac";
            iconeSelecionado = iconeAtual || "📻";

            document.querySelectorAll('.color-dot').forEach(dot => {
                if (dot.getAttribute('data-color') === corSelecionada) dot.classList.add('selected');
                else dot.classList.remove('selected');
            });

            document.querySelectorAll('.icon-option').forEach(opt => {
                if (opt.getAttribute('data-icon') === iconeSelecionado) opt.classList.add('selected');
                else opt.classList.remove('selected');
            });

            modalPersonalizacao.classList.remove('hidden');
        }

        document.getElementById('btnFecharModal').addEventListener('click', () => {
            modalPersonalizacao.classList.add('hidden');
        });

        document.getElementById('btnSalvarPersonalizacao').addEventListener('click', async () => {
            const id = customRadioIdInput.value;
            try {
                const radioRef = ref(db, 'radios_cadastradas/' + id);
                await update(radioRef, { cor: corSelecionada, icone: iconeSelecionado });
                modalPersonalizacao.classList.add('hidden');
                carregarRadios();
            } catch (err) {
                console.error("Erro ao salvar customização:", err);
            }
        });

        async function deletarRadio(id) {
            if (confirm("Tem certeza que deseja excluir esta rádio?")) {
                try {
                    await remove(ref(db, 'radios_cadastradas/' + id));
                    carregarRadios();
                } catch (erro) {
                    console.error("Erro ao remover rádio:", erro);
                }
            }
        }

        function prepararEdicao(id, nome, url) {
            radioIdEditandoInput.value = id;
            nomeRadioInput.value = nome;
            urlRadioInput.value = url;
            formTitulo.innerText = "Editar Rádio";
            btnSalvarRadio.innerText = "ATUALIZAR RÁDIO";
            btnCancelarEdicao.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function limparFormulario() {
            radioIdEditandoInput.value = "";
            nomeRadioInput.value = "";
            urlRadioInput.value = "";
            formTitulo.innerText = "Adicionar Nova Rádio";
            btnSalvarRadio.innerText = "CADASTRAR RÁDIO";
            btnCancelarEdicao.classList.add('hidden');
        }

        btnCancelarEdicao.addEventListener('click', limparFormulario);
        btnSalvarRadio.addEventListener('click', salvarRadio);
    </script>
</body>
</html>
