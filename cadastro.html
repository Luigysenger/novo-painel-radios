<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Cadastro - Sistema de Rádios</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }
        .register-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            border: 1px solid #e2e8f0;
        }
        .register-card h2 {
            text-align: center;
            color: #4c1d95;
            margin-bottom: 25px;
            font-size: 22px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            color: #4c1d95;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
        }
        .uppercase-field {
            text-transform: uppercase;
        }
        .btn-submit {
            width: 100%;
            background: #7c3aed;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background: #6d28d9;
        }
        .btn-back {
            width: 100%;
            background: #64748b;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            margin-top: 8px;
            text-decoration: none;
            display: block;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="register-card">
        <h2>Criar Cadastro</h2>
        
        <div class="form-group">
            <label>Primeiro Nome ou Apelido (Obrigatório Maiúsculo)</label>
            <input type="text" id="apelido" class="uppercase-field" placeholder="Nome ou Apelido" autocomplete="off" oninput="this.value = this.value.toUpperCase()">
        </div>

        <div class="form-group">
            <label>Nome Completo</label>
            <input type="text" id="nomeCompleto" placeholder="Digite seu nome completo" autocomplete="off">
        </div>

        <div class="form-group">
            <label>E-mail</label>
            <input type="email" id="email" placeholder="seu@email.com" autocomplete="off">
        </div>

        <div class="form-group">
            <label>Data de Nascimento (DD/MM/AAAA)</label>
            <input type="text" id="nascimento" placeholder="DD/MM/AAAA" maxlength="10" autocomplete="off">
        </div>

        <div class="form-group">
            <label>Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha" autocomplete="new-password">
        </div>

        <div class="form-group">
            <label>Confirme a Senha</label>
            <input type="password" id="confirmaSenha" placeholder="Digite a senha novamente" autocomplete="new-password">
        </div>

        <button id="btnCadastrar" class="btn-submit">Cadastrar</button>
        <a href="index.html" class="btn-back">Voltar ao Login</a>
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const inputNascimento = document.getElementById('nascimento');
        const inputApelido = document.getElementById('apelido');
        const inputNomeCompleto = document.getElementById('nomeCompleto');
        const inputEmail = document.getElementById('email');
        const inputSenha = document.getElementById('senha');
        const inputConfirmaSenha = document.getElementById('confirmaSenha');
        const btnCadastrar = document.getElementById('btnCadastrar');

        window.addEventListener('DOMContentLoaded', () => {
            inputApelido.value = "";
            inputNomeCompleto.value = "";
            inputEmail.value = "";
            inputNascimento.value = "";
            inputSenha.value = "";
            inputConfirmaSenha.value = "";
        });

        // Nova máscara ajustada para formatar a data automaticamente em tempo real
        inputNascimento.addEventListener('input', function (e) {
            let v = e.target.value.replace(/\D/g, "");
            if (v.length > 8) v = v.slice(0, 8);
            
            if (v.length >= 5) {
                e.target.value = v.slice(0, 2) + '/' + v.slice(2, 4) + '/' + v.slice(4, 8);
            } else if (v.length >= 3) {
                e.target.value = v.slice(0, 2) + '/' + v.slice(2, 4);
            } else {
                e.target.value = v;
            }
        });

        async function realizarCadastro() {
            const apelido = inputApelido.value.trim();
            const nomeCompleto = inputNomeCompleto.value.trim();
            const email = inputEmail.value.trim();
            const nascimento = inputNascimento.value.trim();
            const senha = inputSenha.value.trim();
            const confirmaSenha = inputConfirmaSenha.value.trim();

            if (!apelido || !email || !senha) {
                alert("Por favor, preencha pelo menos o Apelido, E-mail e Senha.");
                return;
            }

            if (senha !== confirmaSenha) {
                alert("As senhas não coincidem!");
                return;
            }

            try {
                await addDoc(collection(db, "usuarios_cadastrados"), {
                    apelido: apelido,
                    nomeCompleto: nomeCompleto,
                    email: email,
                    nascimento: nascimento,
                    senha: senha,
                    timestamp: serverTimestamp()
                });

                alert("Cadastro realizado com sucesso!");
                window.location.href = "index.html";
            } catch (erro) {
                console.error("Erro ao cadastrar:", erro);
                alert("Erro ao realizar cadastro. Verifique sua conexão.");
            }
        }

        btnCadastrar.addEventListener('click', realizarCadastro);
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                realizarCadastro();
            }
        });
    </script>
</body>
</html>
