<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Cadastro - Sistema de Rádios</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .register-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(10px);
            padding: 35px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .register-card h2 {
            text-align: center;
            color: #f8fafc;
            margin-bottom: 25px;
            font-size: 22px;
            letter-spacing: 0.5px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: bold;
            color: #94a3b8;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }
        .form-group input {
            width: 100%;
            padding: 11px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            font-size: 14px;
            color: #f8fafc;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            border-color: #8b5cf6;
        }
        .uppercase-field {
            text-transform: uppercase;
        }
        .btn-submit {
            width: 100%;
            background: #7c3aed;
            color: white;
            border: none;
            padding: 13px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn-submit:hover {
            background: #6d28d9;
        }
        .btn-back {
            width: 100%;
            background: transparent;
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 11px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            margin-top: 8px;
            text-decoration: none;
            display: block;
            text-align: center;
            transition: all 0.2s;
        }
        .btn-back:hover {
            background: #334155;
            color: #f8fafc;
        }
    </style>
</head>
<body>

    <div class="register-card">
        <h2>Criar Novo Cadastro</h2>
        
        <div class="form-group">
            <label>PRIMEIRO NOME OU APELIDO</label>
            <input type="text" id="apelido" class="uppercase-field" placeholder="Ex: JOAO" autocomplete="off" oninput="this.value = this.value.toUpperCase()">
        </div>

        <div class="form-group">
            <label>NOME COMPLETO</label>
            <input type="text" id="nomeCompleto" placeholder="Digite seu nome completo" autocomplete="off">
        </div>

        <div class="form-group">
            <label>E-MAIL</label>
            <input type="email" id="email" placeholder="seu@email.com" autocomplete="off">
        </div>

        <div class="form-group">
            <label>DATA DE NASCIMENTO</label>
            <input type="text" id="nascimento" placeholder="DD/MM/AAAA" maxlength="10" autocomplete="off">
        </div>

        <div class="form-group">
            <label>SENHA</label>
            <input type="password" id="senha" placeholder="Digite sua senha" autocomplete="new-password">
        </div>

        <div class="form-group">
            <label>CONFIRME A SENHA</label>
            <input type="password" id="confirmaSenha" placeholder="Digite a senha novamente" autocomplete="new-password">
        </div>

        <button id="btnCadastrar" class="btn-submit">FINALIZAR CADASTRO</button>
        <a href="index.html" class="btn-back">Voltar ao Login</a>
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { ref, push, set, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const inputNascimento = document.getElementById('nascimento');
        const inputApelido = document.getElementById('apelido');
        const inputNomeCompleto = document.getElementById('nomeCompleto');
        const inputEmail = document.getElementById('email');
        const inputSenha = document.getElementById('senha');
        const inputConfirmaSenha = document.getElementById('confirmaSenha');
        const btnCadastrar = document.getElementById('btnCadastrar');

        window.addEventListener('DOMContentLoaded', () => {
            inputApelido.value = "";
            inputNomeCompleto.value = "";
            inputEmail.value = "";
            inputNascimento.value = "";
            inputSenha.value = "";
            inputConfirmaSenha.value = "";
        });

        // Máscara cirúrgica ultra-eficiente para formatação em tempo real da data DD/MM/AAAA
        inputNascimento.addEventListener('input', function (e) {
            let v = e.target.value.replace(/\D/g, "");
            if (v.length > 8) v = v.slice(0, 8);
            
            let resultado = "";
            if (v.length > 0) {
                resultado += v.substring(0, 2);
            }
            if (v.length >= 3) {
                resultado += '/' + v.substring(2, 4);
            }
            if (v.length >= 5) {
                resultado += '/' + v.substring(4, 8);
            }
            e.target.value = resultado;
        });

        async function realizarCadastro() {
            const apelido = inputApelido.value.trim();
            const nomeCompleto = inputNomeCompleto.value.trim();
            const email = inputEmail.value.trim();
            const nascimento = inputNascimento.value.trim();
            const senha = inputSenha.value.trim();
            const confirmaSenha = inputConfirmaSenha.value.trim();

            if (!apelido || !email || !senha) {
                alert("Por favor, preencha pelo menos o Apelido, E-mail e Senha.");
                return;
            }

            if (senha !== confirmaSenha) {
                alert("As senhas não coincidem!");
                return;
            }

            try {
                const novoUsuarioRef = push(ref(db, 'usuarios_cadastrados'));
                await set(novoUsuarioRef, {
                    apelido: apelido,
                    nomeCompleto: nomeCompleto,
                    email: email,
                    nascimento: nascimento,
                    senha: senha,
                    timestamp: serverTimestamp()
                });

                alert("Cadastro realizado com sucesso!");
                window.location.href = "index.html";
            } catch (erro) {
                console.error("Erro ao cadastrar:", erro);
                alert("Erro ao realizar cadastro. Verifique sua conexão.");
            }
        }

        btnCadastrar.addEventListener('click', realizarCadastro);
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                realizarCadastro();
            }
        });
    </script>
</body>
</html>
