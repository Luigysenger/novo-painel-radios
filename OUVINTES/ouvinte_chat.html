<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Ouvinte - Chat estilo WhatsApp</title>
    <!-- Scripts do Firebase (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f3f0f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(88, 28, 135, 0.1);
            width: 100%;
            max-width: 450px;
            height: 85vh;
            display: flex;
            flex-direction: column;
            border-top: 5px solid #6b21a8;
        }
        h2 {
            text-align: center;
            color: #4c1d95;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 20px;
        }
        .identificacao-box {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #5b21b6;
            font-size: 13px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 9px;
            border: 1px solid #d8b4fe;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 5px rgba(124, 58, 237, 0.3);
        }
        /* Estilo do Chat (Estilo WhatsApp) */
        .chat-container {
            flex: 1;
            border: 1px solid #d8b4fe;
            border-radius: 8px;
            background-color: #efe7f5;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 10px;
        }
        .mensagem {
            max-width: 75%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            word-wrap: break-word;
            position: relative;
        }
        .mensagem.recebida {
            background-color: #ffffff;
            align-self: flex-start;
            border-left: 4px solid #7c3aed;
        }
        .mensagem.enviada {
            background-color: #e9d5ff;
            align-self: flex-end;
            border-right: 4px solid #6b21a8;
        }
        .msg-autor {
            font-size: 11px;
            font-weight: bold;
            color: #4c1d95;
            margin-bottom: 3px;
        }
        .msg-texto {
            color: #333333;
        }
        .chat-input-area {
            display: flex;
            gap: 8px;
        }
        .chat-input-area input {
            flex: 1;
        }
        button {
            padding: 10px 15px;
            background-color: #7c3aed;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #6d28d9;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Chat da Rádio</h2>
        
        <div class="identificacao-box">
            <label>Seu Apelido / Nome no Chat</label>
            <input type="text" id="chat-usuario" placeholder="Digite seu nome ou apelido">
        </div>

        <!-- Caixa de Mensagens -->
        <div id="chat-mensagens" class="chat-container">
            <!-- As mensagens aparecem aqui em tempo real -->
        </div>

        <!-- Área de Envio -->
        <div class="chat-input-area">
            <input type="text" id="chat-mensagem-texto" placeholder="Digite sua mensagem..." onkeypress="verificarEnterChat(event)">
            <button onclick="enviarMensagem()">Enviar</button>
        </div>
    </div>

    <script>
        // Configuração do Firebase utilizando o seu projeto
        const firebaseConfig = {
            databaseURL: "https://novo-jeito-de-ouvir-radio-default-rtdb.firebaseio.com"
        };

        // Inicializar Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // Referência para o chat no Realtime Database
        const chatRef = db.ref('chat_ouvintes');

        // Escutar mensagens em tempo real (aparece igual WhatsApp para qualquer dispositivo conectado)
        chatRef.on('child_added', (snapshot) => {
            const dados = snapshot.val();
            adicionarMensagemNaTela(dados.usuario, dados.mensagem);
        });

        function enviarMensagem() {
            const usuario = document.getElementById('chat-usuario').value.trim();
            const mensagemInput = document.getElementById('chat-mensagem-texto');
            const mensagem = mensagemInput.value.trim();

            if (!usuario) {
                alert('Por favor, digite seu apelido/nome antes de enviar mensagens!');
                document.getElementById('chat-usuario').focus();
                return;
            }

            if (!mensagem) {
                return;
            }

            // Envia a nova mensagem para o Firebase
            const novaMensagemRef = chatRef.push();
            novaMensagemRef.set({
                usuario: usuario,
                mensagem: mensagem,
                timestamp: Date.now()
            });

            // Limpa o campo de texto da mensagem
            mensagemInput.value = '';
        }

        function verificarEnterChat(event) {
            if (event.key === 'Enter') {
                enviarMensagem();
            }
        }

        function adicionarMensagemNaTela(autor, texto) {
            const container = document.getElementById('chat-mensagens');
            const usuarioAtual = document.getElementById('chat-usuario').value.trim();

            const divMsg = document.createElement('div');
            divMsg.classList.add('mensagem');

            // Diferencia visualmente as mensagens enviadas por quem está digitando vs outros
            if (autor === usuarioAtual && usuarioAtual !== "") {
                divMsg.classList.add('enviada');
            } else {
                divMsg.classList.add('recebida');
            }

            divMsg.innerHTML = `
                <div class="msg-autor">${autor}</div>
                <div class="msg-texto">${texto}</div>
            `;

            container.appendChild(divMsg);
            
            // Auto scroll para a mensagem mais recente
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
