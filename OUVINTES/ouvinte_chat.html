<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Ouvinte - Chat com ADM</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #0b0713;
            color: #ffffff;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .logo-area h1 {
            color: #ff2a85;
            font-size: 22px;
        }
        .logo-area p {
            color: #a0a0a0;
            font-size: 13px;
        }
        .btn-voltar {
            background-color: #7c3aed;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
        }
        .chat-container {
            max-width: 700px;
            margin: 0 auto;
            background: #140d24;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .chat-messages {
            height: 350px;
            overflow-y: auto;
            background: #0b0713;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message-bubble {
            background: #1f1235;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            max-width: 80%;
            border: 1px solid #7c3aed;
            word-break: break-word;
        }
        .chat-input-area {
            display: flex;
            gap: 10px;
        }
        .chat-input {
            flex: 1;
            background: #1f1235;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 8px;
            color: white;
            font-size: 14px;
        }
        .btn-enviar {
            background: #ff2a85;
            color: white;
            border: none;
            padding: 0 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-enviar:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <h1>Chat com o Administrador</h1>
            <p>Envie sua mensagem ou pedido de rádio em tempo real</p>
        </div>
        <div>
            <a href="ouvinte_cards_radio.html" class="btn-voltar">Voltar ao Painel</a>
        </div>
    </header>

    <div class="chat-container">
        <h3 style="margin-bottom: 15px; font-size: 15px; color: #e0e0e0;">💬 Suas Mensagens e Respostas</h3>
        
        <div id="boxMensagens" class="chat-messages">
            <div class="message-bubble">Conectando ao chat...</div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="inputMensagem" class="chat-input" placeholder="Escreva seu recado ou pedido de rádio aqui...">
            <button id="btnEnviar" class="btn-enviar">Enviar</button>
        </div>
    </div>

    <!-- Script com Firebase Inicializado Diretamente -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        // Importando do SDK modular correto
        import { initializeApp as initFirebase } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Configuração direta do seu projeto do Firebase
        const firebaseConfig = {
            projectId: "novo-jeito-de-ouvir-radio",
            // Insira sua apiKey e appId se necessário, ou deixe configurado com o projectId se já inicializado
        };

        // Vamos puxar a mesma configuração do seu arquivo firebase-config.js padrão para garantir:
        import { db } from '../firebase-config.js';

        const boxMensagens = document.getElementById('boxMensagens');
        const inputMensagem = document.getElementById('inputMensagem');
        const btnEnviar = document.getElementById('btnEnviar');

        let ouvinteId = localStorage.getItem('ouvinte_chat_id');
        if (!ouvinteId) {
            ouvinteId = 'ouvinte_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('ouvinte_chat_id', ouvinteId);
        }

        // Verificação de segurança para o DB
        if (!db) {
            console.error("Erro crítico: Banco de dados Firebase não carregado.");
            boxMensagens.innerHTML = '<div class="message-bubble">Erro de configuração do Firebase.</div>';
        }

        onSnapshot(collection(db, "mensagens_chat"), (snapshot) => {
            boxMensagens.innerHTML = "";
            if (snapshot.empty) {
                boxMensagens.innerHTML = '<div class="message-bubble">Nenhuma mensagem enviada ainda. Digite algo abaixo!</div>';
                return;
            }

            let mensagens = [];
            snapshot.forEach((doc) => {
                mensagens.push({ id: doc.id, ...doc.data() });
            });

            mensagens.sort((a, b) => {
                const tempoA = a.timestamp?.toMillis ? a.timestamp.toMillis() : 0;
                const tempoB = b.timestamp?.toMillis ? b.timestamp.toMillis() : 0;
                return tempoA - tempoB;
            });

            mensagens.forEach((dados) => {
                const div = document.createElement('div');
                div.className = 'message-bubble';
                div.textContent = dados.texto || "Mensagem vazia";
                boxMensagens.appendChild(div);
            });

            boxMensagens.scrollTop = boxMensagens.scrollHeight;
        }, (error) => {
            console.error("Erro ao carregar chat: ", error);
            boxMensagens.innerHTML = '<div class="message-bubble">Erro ao conectar com o chat em tempo real.</div>';
        });

        async function enviarMensagem() {
            const textoMensagem = inputMensagem.value.trim();
            if (textoMensagem === "") return;

            btnEnviar.disabled = true;

            try {
                await addDoc(collection(db, "mensagens_chat"), {
                    texto: textoMensagem,
                    remetenteId: ouvinteId,
                    timestamp: serverTimestamp()
                });
                inputMensagem.value = "";
                inputMensagem.focus();
            } catch (erro) {
                console.error("Erro ao enviar mensagem: ", erro);
                alert("Erro ao enviar mensagem. Verifique a conexão.");
            } finally {
                btnEnviar.disabled = false;
            }
        }

        btnEnviar.addEventListener('click', enviarMensagem);

        inputMensagem.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                enviarMensagem();
            }
        });
    </script>

</body>
</html>
