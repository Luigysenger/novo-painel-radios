<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat com a Administração</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
body{min-height:100vh;background:linear-gradient(135deg,#090d16 0%,#17153a 100%);color:#f8fafc;padding:20px}
.chat-page{max-width:900px;margin:0 auto}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;padding:16px 18px;background:rgba(23,31,53,.85);border:1px solid rgba(255,255,255,.08);border-radius:16px}
.topbar h1{font-size:20px;color:#38bdf8}.topbar p{font-size:12px;color:#94a3b8;margin-top:4px}
.btn-voltar{border:0;border-radius:9px;padding:10px 15px;background:#475569;color:#fff;font-weight:700;cursor:pointer}
.chat-box{background:rgba(23,31,53,.78);border:1px solid rgba(56,189,248,.18);border-radius:18px;padding:18px;box-shadow:0 10px 35px rgba(0,0,0,.25)}
.status{font-size:11px;color:#4ade80;margin-bottom:12px;font-weight:700}
.messages{height:55vh;min-height:330px;overflow-y:auto;background:#0f172a;border:1px solid #334155;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:80%;padding:10px 12px;border-radius:12px;line-height:1.45;font-size:13px;word-break:break-word}.msg.ouvinte{align-self:flex-end;background:#6d28d9}.msg.adm{align-self:flex-start;background:#1e293b;border:1px solid #334155}.msg small{display:block;margin-top:5px;font-size:9px;color:#cbd5e1;opacity:.8}
.empty{text-align:center;color:#64748b;margin:auto;font-size:12px}
.send{display:flex;gap:8px;margin-top:12px}.send textarea{flex:1;min-height:54px;max-height:120px;resize:vertical;background:#0f172a;border:1px solid #334155;border-radius:10px;color:#fff;padding:11px;outline:none}.send textarea:focus{border-color:#38bdf8}.send button{border:0;border-radius:10px;padding:0 18px;background:#0284c7;color:#fff;font-weight:800;cursor:pointer}
@media(max-width:600px){body{padding:10px}.topbar{align-items:flex-start;flex-direction:column}.messages{height:60vh}.msg{max-width:92%}.send{flex-direction:column}.send button{min-height:44px}}
</style>
</head>
<body>
<div class="chat-page">
  <div class="topbar">
    <div><h1>💬 Chat com a Administração</h1><p id="nomeOuvinte">Identificando ouvinte...</p></div>
    <button class="btn-voltar" id="btnVoltar">← Voltar ao Painel</button>
  </div>
  <div class="chat-box">
    <div class="status" id="statusChat">● Conectando...</div>
    <div class="messages" id="mensagensChat"><div class="empty">Carregando conversa...</div></div>
    <div class="send">
      <textarea id="textoMensagem" placeholder="Escreva sua mensagem para a administração..."></textarea>
      <button id="btnEnviar">Enviar</button>
    </div>
  </div>
</div>
<script type="module">
import { db } from '../firebase-config.js';
import { ref, get, push, set, update, onValue, onDisconnect } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js';

let ouvinteId = localStorage.getItem('usuarioKey') || localStorage.getItem('userId') || null;
let ouvinteNome = localStorage.getItem('usuarioNome') || localStorage.getItem('usuarioLogado') || 'Ouvinte';
let timerPresenca = null;

const mensagensEl=document.getElementById('mensagensChat');
const textoEl=document.getElementById('textoMensagem');
const statusEl=document.getElementById('statusChat');
const nomeEl=document.getElementById('nomeOuvinte');

function escapeHtml(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}

async function resolverUsuario(){
  if(!ouvinteId){
    try{
      const snap=await get(ref(db,'contas'));
      const alvo=String(localStorage.getItem('usuarioLogado')||localStorage.getItem('usuarioNome')||'').trim().toLowerCase();
      if(snap.exists()) snap.forEach(child=>{
        if(ouvinteId) return;
        const c=child.val()||{};
        const candidatos=[c.nome,c.email,c.login].filter(Boolean).map(v=>String(v).trim().toLowerCase());
        if(alvo && candidatos.includes(alvo)){ouvinteId=child.key;ouvinteNome=c.nome||ouvinteNome;}
      });
    }catch(e){console.warn(e)}
  }
  if(!ouvinteId){
    const base=String(localStorage.getItem('usuarioLogado')||'ouvinte_anonimo');
    ouvinteId=base.replace(/[^a-zA-Z0-9_-]/g,'_');
  }
  localStorage.setItem('usuarioKey',ouvinteId);
  localStorage.setItem('userId',ouvinteId);
  localStorage.setItem('usuarioNome',ouvinteNome);
  nomeEl.textContent='Olá, '+ouvinteNome;
}

async function ativarPresenca(){
  const perfilRef=ref(db,`ouvintes_chat/${ouvinteId}/perfil`);
  const presencaRef=ref(db,`ouvintes_chat/${ouvinteId}/presenca`);
  const contaRef=ref(db,`contas/${ouvinteId}`);
  await update(perfilRef,{nome:ouvinteNome});
  await update(presencaRef,{status:'online',lastSeen:Date.now()});
  await update(contaRef,{status:'online',lastSeen:Date.now()});
  try{
    await onDisconnect(presencaRef).set({status:'offline',lastSeen:Date.now()});
    await onDisconnect(contaRef).update({status:'offline',lastSeen:Date.now()});
  }catch(e){}
  if(timerPresenca) clearInterval(timerPresenca);
  timerPresenca=setInterval(()=>{
    const agora=Date.now();
    update(presencaRef,{status:'online',lastSeen:agora}).catch(()=>{});
    update(contaRef,{status:'online',lastSeen:agora}).catch(()=>{});
  },20000);
  statusEl.textContent='● Online — mensagens em tempo real';
}

function ouvirConversa(){
  onValue(ref(db,`ouvintes_chat/${ouvinteId}/mensagens`),snap=>{
    const lista=[];
    if(snap.exists()) snap.forEach(child=>lista.push({id:child.key,...(child.val()||{})}));
    lista.sort((a,b)=>Number(a.timestamp||0)-Number(b.timestamp||0));
    mensagensEl.innerHTML='';
    if(!lista.length){mensagensEl.innerHTML='<div class="empty">Nenhuma mensagem ainda. Escreva para a administração quando precisar.</div>';return}
    lista.slice(-100).forEach(m=>{
      const div=document.createElement('div');
      div.className='msg '+(m.remetente==='adm'?'adm':'ouvinte');
      const hora=m.timestamp?new Date(Number(m.timestamp)).toLocaleString('pt-BR'):'';
      div.innerHTML=`${escapeHtml(m.texto||'')}<small>${m.remetente==='adm'?'Administração':'Você'} • ${escapeHtml(hora)}</small>`;
      mensagensEl.appendChild(div);
    });
    mensagensEl.scrollTop=mensagensEl.scrollHeight;
  },erro=>{statusEl.textContent='Erro ao conectar ao chat';console.error(erro)});
}

async function enviar(){
  const texto=textoEl.value.trim(); if(!texto)return;
  try{
    await set(push(ref(db,`ouvintes_chat/${ouvinteId}/mensagens`)),{remetente:'ouvinte',texto,timestamp:Date.now()});
    textoEl.value='';textoEl.focus();
  }catch(e){console.error(e);alert('Não foi possível enviar a mensagem. Verifique a conexão e as regras do Firebase.')}
}

document.getElementById('btnEnviar').addEventListener('click',enviar);
textoEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();enviar()}});
document.getElementById('btnVoltar').addEventListener('click',()=>{window.location.href='index.html'});

await resolverUsuario();
await ativarPresenca();
ouvirConversa();
</script>
</body>
</html>
