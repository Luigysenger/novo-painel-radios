            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(88, 28, 135, 0.1);
            width: 100%;
            max-width: 450px;
            border-top: 5px solid #6b21a8;
        }
        h2 {
            text-align: center;
            color: #4c1d95;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #5b21b6;
            font-size: 14px;
            font-weight: 600;
        }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #d8b4fe;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, textarea:focus, select:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 5px rgba(124, 58, 237, 0.3);
        }
        button {
            width: 100%;
            padding: 11px;
            background-color: #7c3aed;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #6d28d9;
        }
        .status-msg {
            text-align: center;
            font-size: 13px;
            color: #047857;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
