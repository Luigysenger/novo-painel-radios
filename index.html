<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Painel do Ouvinte</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #0f1016;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #ffffff;
        }
        .login-card {
            background: #1a1c29;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            border: 1px solid #2d2f45;
        }
        .login-card h2 {
            text-align: center;
            color: #a855f7;
            margin-bottom: 25px;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #c084fc;
            margin-bottom: 8px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            background: #11131d;
            border: 1px solid #374151;
            border-radius: 6px;
            color: #ffffff;
            font-size: 14px;
        }
        .form-group input:focus {
            border-color: #a855f7;
            outline: none;
        }
        .btn-submit {
            width: 100%;
            background: #7c3aed;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
            transition: background 0.2s;
        }
        .btn-submit:hover {
            background: #6d28d9;
        }
        .login-links {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 13px;
        }
        .login-links a {
            color: #c084fc;
            text-decoration: none;
        }
        .login-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Painel do Ouvinte</h2>
        
        <div class="form-group">
            <label>E-mail ou Apelido</label>
            <input type="text" id="loginUsuario" placeholder="Digite seu e-mail ou apelido" autocomplete="off">
        </div>

        <div class="form-group">
            <label>Senha</label>
            <input type="password" id="loginSenha" placeholder="Digite sua senha" autocomplete="current-password">
        </div>

        <button id="btnLogin" class="btn-submit">Entrar</button>

        <div class="login-links">
            <a href="cadastro.html">Não tenho cadastro</a>
            <a href="#" onclick="alert('Função de recuperação de senha em breve!'); return false;">Esqueci minha senha</a>
        </div>
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const inputUsuario = document.getElementById('loginUsuario');
        const inputSenha = document.getElementById('loginSenha');
        const btnLogin = document.getElementById('btnLogin');

        // Limpa campos ao carregar para evitar dados antigos
        window.addEventListener('DOMContentLoaded', () => {
            inputUsuario.value = "";
            inputSenha.value = "";
        });

        async function realizarLogin() {
            const usuario = inputUsuario.value.trim();
            const senha = inputSenha.value.trim();

            if (!usuario || !senha) {
                alert("Por favor, preencha todos os campos.");
                return;
            }

            try {
                // Consulta no Firebase se o usuário existe (por e-mail ou apelido)
                const q = query(collection(db, "usuarios_cadastrados"), where("email", "==", usuario));
                const querySnapshot = await getDocs(q);

                let usuarioEncontrado = false;
                querySnapshot.forEach((doc) => {
                    const dados = doc.data();
                    if (dados.senha === senha) {
                        usuarioEncontrado = true;
                    }
                });

                if (usuarioEncontrado) {
                    alert("Login realizado com sucesso!");
                    window.location.href = "OUVINTES/ouvinte_cards_radio.html";
                } else {
                    alert("E-mail/Apelido ou senha incorretos.");
                }
            } catch (erro) {
                console.error("Erro no login:", erro);
                alert("Erro ao conectar com o banco de dados.");
            }
        }

        btnLogin.addEventListener('click', realizarLogin);
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                realizarLogin();
            }
        });
    </script>
</body>
</html>
