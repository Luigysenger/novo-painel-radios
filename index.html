<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Rádios</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }
        .login-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            border: 1px solid #e2e8f0;
        }
        .login-card h2 {
            text-align: center;
            color: #4c1d95;
            margin-bottom: 25px;
            font-size: 22px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            color: #4c1d95;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
        }
        .btn-submit {
            width: 100%;
            background: #7c3aed;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background: #6d28d9;
        }
        .btn-register {
            width: 100%;
            background: #ffffff;
            color: #7c3aed;
            border: 1px solid #7c3aed;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            margin-top: 8px;
            text-decoration: none;
            display: block;
            text-align: center;
        }
        .btn-register:hover {
            background: #f5f3ff;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Entrar no Sistema</h2>
        
        <div class="form-group">
            <label>E-MAIL</label>
            <input type="email" id="emailLogin" placeholder="seu@email.com" autocomplete="off">
        </div>

        <div class="form-group">
            <label>SENHA</label>
            <input type="password" id="senhaLogin" placeholder="Digite sua senha" autocomplete="current-password">
        </div>

        <button id="btnLogin" class="btn-submit">Entrar</button>
        <a href="cadastro.html" class="btn-register">Criar Novo Cadastro</a>
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { ref, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const inputEmail = document.getElementById('emailLogin');
        const inputSenha = document.getElementById('senhaLogin');
        const btnLogin = document.getElementById('btnLogin');

        window.addEventListener('DOMContentLoaded', () => {
            inputEmail.value = "";
            inputSenha.value = "";
        });

        async function realizarLogin() {
            const email = inputEmail.value.trim();
            const senha = inputSenha.value.trim();

            if (!email || !senha) {
                alert("Por favor, preencha o e-mail e a senha.");
                return;
            }

            try {
                const dbRef = ref(db);
                const snapshot = await get(child(dbRef, 'usuarios_cadastrados'));

                if (snapshot.exists()) {
                    let usuarioEncontrado = false;
                    snapshot.forEach((childSnapshot) => {
                        const dados = childSnapshot.val();
                        if (dados.email === email && dados.senha === senha) {
                            usuarioEncontrado = true;
                            // Salva o apelido no navegador para uso futuro
                            localStorage.setItem('usuarioLogado', dados.apelido);
                        }
                    });

                    if (usuarioEncontrado) {
                        alert("Login realizado com sucesso!");
                        window.location.href = "OUVINTES/index.html"; // Redireciona para a pasta de ouvintes
                    } else {
                        alert("E-mail ou senha incorretos!");
                    }
                } else {
                    alert("Nenhum usuário cadastrado encontrado no sistema.");
                }
            } catch (erro) {
                console.error("Erro ao fazer login:", erro);
                alert("Erro ao conectar com o banco de dados.");
            }
        }

        btnLogin.addEventListener('click', realizarLogin);
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                realizarLogin();
            }
        });
    </script>
</body>
</html>
