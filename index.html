<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar no Sistema - Radios</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #090d16 0%, #17153a 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-card {
            background: rgba(23, 31, 53, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            text-align: center;
        }
        .login-card h2 {
            font-size: 22px;
            color: #f8fafc;
            margin-bottom: 30px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            font-size: 11px;
            color: #94a3b8;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .input-group input {
            width: 100%;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 12px 15px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-group input:focus {
            border-color: #a855f7;
        }
        .btn-submit {
            background: linear-gradient(135deg, #9333ea, #7e22ce);
            color: white;
            border: none;
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(147, 51, 234, 0.4);
            transition: all 0.2s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(147, 51, 234, 0.6);
        }
        .login-links {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            font-size: 12px;
        }
        .login-links a {
            color: #94a3b8;
            text-decoration: none;
            transition: color 0.2s;
        }
        .login-links a:hover {
            color: #f472b6;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Entrar no Sistema</h2>
        <form id="loginForm">
            <div class="input-group">
                <label>E-mail</label>
                <input type="email" id="loginEmail" required placeholder="seu@email.com">
            </div>
            <div class="input-group">
                <label>Senha</label>
                <input type="password" id="loginSenha" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-submit">ACESSAR PAINEL</button>
        </form>
        <div class="login-links">
            <a href="recuperar.html">Esqueci a senha</a>
            <a href="cadastro.html">Não tenho cadastro</a>
        </div>
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const senha = document.getElementById('loginSenha').value.trim();

            if (email === "adm@admin.com" && senha === "admin123") {
                localStorage.setItem('usuarioLogado', 'Administrador');
                // Redirecionamento direto sem alertas
                window.location.href = "ADM/index.html";
                return;
            }

            try {
                const ouvintesRef = ref(db, 'cadastros_ouvintes');
                const snapshot = await get(ouvintesRef);

                let usuarioEncontrado = null;

                if (snapshot.exists()) {
                    snapshot.forEach((child) => {
                        const dados = child.val();
                        if (dados.email.toLowerCase() === email.toLowerCase() && dados.senha === senha) {
                            usuarioEncontrado = dados;
                        }
                    });
                }

                if (usuarioEncontrado) {
                    localStorage.setItem('usuarioLogado', usuarioEncontrado.nome || email);
                    // Ajuste cirúrgico: Removido o alert() e aberto o painel diretamente
                    window.location.href = "OUVINTES/index.html";
                } else {
                    alert("E-mail ou senha incorretos!");
                }
            } catch (err) {
                console.error("Erro ao fazer login:", err);
                alert("Erro ao conectar com o banco de dados.");
            }
        });
    </script>
</body>
</html>
