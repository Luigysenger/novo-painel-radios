<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Cadastro - Sistema de Rádios</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }
        .register-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            border: 1px solid #e2e8f0;
        }
        .register-card h2 {
            text-align: center;
            color: #4c1d95;
            margin-bottom: 25px;
            font-size: 22px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            color: #4c1d95;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
        }
        /* Força apenas o campo de apelido/primeiro nome em maiúsculo */
        .uppercase-field {
            text-transform: uppercase;
        }
        .btn-submit {
            width: 100%;
            background: #7c3aed;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background: #6d28d9;
        }
        .btn-back {
            width: 100%;
            background: #64748b;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            margin-top: 8px;
            text-decoration: none;
            display: block;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="register-card">
        <h2>Criar Cadastro</h2>
        
        <div class="form-group">
            <label>Primeiro Nome ou Apelido (Obrigatório Maiúsculo)</label>
            <!-- A classe uppercase-field garante que só este campo fique em maiúsculo e o placeholder foi alterado -->
            <input type="text" id="apelido" class="uppercase-field" placeholder="Nome ou Apelido" oninput="this.value = this.value.toUpperCase()">
        </div>

        <div class="form-group">
            <label>Nome Completo</label>
            <input type="text" id="nomeCompleto" placeholder="Digite seu nome completo">
        </div>

        <div class="form-group">
            <label>E-mail</label>
            <input type="email" id="email" placeholder="seu@email.com">
        </div>

        <div class="form-group">
            <label>Data de Nascimento (XX-XX-XXXX)</label>
            <input type="text" id="nascimento" placeholder="DD-MM-AAAA">
        </div>

        <div class="form-group">
            <label>Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha">
        </div>

        <div class="form-group">
            <label>Confirme a Senha</label>
            <input type="password" id="confirmaSenha" placeholder="Digite a senha novamente">
        </div>

        <button class="btn-submit">Cadastrar</button>
        <a href="OUVINTES/ouvinte_cards_radio.html" class="btn-back">Voltar ao Login / Painel</a>
    </div>

</body>
</html>
