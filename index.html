<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Rádios</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }
        .login-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .login-card h2 {
            text-align: center;
            color: #f8fafc;
            margin-bottom: 30px;
            font-size: 24px;
            letter-spacing: 0.5px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: bold;
            color: #94a3b8;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            font-size: 14px;
            color: #f8fafc;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            border-color: #8b5cf6;
        }
        .btn-submit {
            width: 100%;
            background: #7c3aed;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn-submit:hover {
            background: #6d28d9;
        }
        .actions-links {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            font-size: 13px;
        }
        .actions-links a {
            color: #a78bfa;
            text-decoration: none;
            transition: color 0.2s;
        }
        .actions-links a:hover {
            color: #c4b5fd;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Entrar no Sistema</h2>
        
        <div class="form-group">
            <label>E-MAIL</label>
            <input type="email" id="emailLogin" placeholder="seu@email.com" autocomplete="off">
        </div>

        <div class="form-group">
            <label>SENHA</label>
            <input type="password" id="senhaLogin" placeholder="••••••••" autocomplete="current-password">
        </div>

        <button id="btnLogin" class="btn-submit">ACESSAR PAINEL</button>

        <div class="actions-links">
            <a href="#" id="btnEsqueciSenha">Esqueci a senha</a>
            <a href="cadastro.html">Não tenho cadastro</a>
        </div>
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { ref, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const inputEmail = document.getElementById('emailLogin');
        const inputSenha = document.getElementById('senhaLogin');
        const btnLogin = document.getElementById('btnLogin');
        const btnEsqueciSenha = document.getElementById('btnEsqueciSenha');

        window.addEventListener('DOMContentLoaded', () => {
            inputEmail.value = "";
            inputSenha.value = "";
        });

        async function realizarLogin() {
            const email = inputEmail.value.trim();
            const senha = inputSenha.value.trim();

            if (!email || !senha) {
                alert("Por favor, preencha o e-mail e a senha.");
                return;
            }

            try {
                const dbRef = ref(db);
                const snapshot = await get(child(dbRef, 'usuarios_cadastrados'));

                if (snapshot.exists()) {
                    let usuarioEncontrado = false;
                    snapshot.forEach((childSnapshot) => {
                        const dados = childSnapshot.val();
                        if (dados.email === email && dados.senha === senha) {
                            usuarioEncontrado = true;
                            localStorage.setItem('usuarioLogado', dados.apelido);
                        }
                    });

                    if (usuarioEncontrado) {
                        alert("Login realizado com sucesso!");
                        window.location.href = "OUVINTES/index.html";
                    } else {
                        alert("E-mail ou senha incorretos!");
                    }
                } else {
                    alert("Nenhum usuário cadastrado encontrado no sistema.");
                }
            } catch (erro) {
                console.error("Erro ao fazer login:", erro);
                alert("Erro ao conectar com o banco de dados.");
            }
        }

        btnEsqueciSenha.addEventListener('click', (e) => {
            e.preventDefault();
            alert("Para recuperar sua senha, entre em contato com o suporte da rádio.");
        });

        btnLogin.addEventListener('click', realizarLogin);
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                realizarLogin();
            }
        });
    </script>
</body>
</html>
