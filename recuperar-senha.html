<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Rádios</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }
        .login-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }
        .login-card h2 {
            text-align: center;
            color: #f8fafc;
            margin-bottom: 30px;
            font-size: 24px;
            letter-spacing: 0.5px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: bold;
            color: #94a3b8;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            font-size: 14px;
            color: #f8fafc;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            border-color: #8b5cf6;
        }
        .btn-submit {
            width: 100%;
            background: #7c3aed;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
            margin-top: 10px;
            transition: background 0.2s;
            text-decoration: none;
            display: block;
            text-align: center;
        }
        .btn-submit:hover {
            background: #6d28d9;
        }
        .actions-links {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            font-size: 13px;
        }
        .actions-links a {
            color: #a78bfa;
            text-decoration: none;
            transition: color 0.2s;
            cursor: pointer;
        }
        .actions-links a:hover {
            color: #c4b5fd;
            text-decoration: underline;
        }
        .hidden { display: none !important; }
        .slide-down { animation: slideDownAnim 0.4s ease-out forwards; }
        @keyframes slideDownAnim {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .success-text {
            text-align: center;
            color: #4ade80;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body><div class="login-card"><h2>Recuperar meu acesso</h2><p>Use o e-mail do seu cadastro antigo. Você não precisa criar outro perfil.</p><form><label for="email">E-mail cadastrado</label><input type="email" autocomplete="email" required id="email"><button class="btn-submit">Enviar link para criar nova senha</button></form><p role="status"></p><a href="index.html">Voltar ao login</a></div><script type="module">
import {db} from './firebase-config.js';import {getAuth,sendPasswordResetEmail} from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
const auth=getAuth(db.app);auth.languageCode='pt-BR';document.querySelector('form').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button'),msg=document.querySelector('[role=status]');if(b.disabled)return;b.disabled=true;try{await sendPasswordResetEmail(auth,document.querySelector('#email').value.trim());msg.textContent='Se o cadastro estiver habilitado, o link chegará por e-mail. Confira também a pasta de spam.'}catch(err){msg.textContent=err.code==='auth/user-not-found'?'Se o cadastro estiver habilitado, o link chegará por e-mail. Confira também a pasta de spam.':'Não foi possível solicitar o link agora. Tente novamente mais tarde.'}finally{b.disabled=false}};
</script></body></html>
